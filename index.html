<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quo Calculator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232563eb'/%3E%3Ccircle cx='32' cy='17' r='6' fill='white'/%3E%3Crect x='14' y='28' width='36' height='8' rx='4' fill='white'/%3E%3Ccircle cx='32' cy='47' r='6' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --blue-900:#0b1f5c; --blue-700:#1d4ed8; --blue-600:#2563eb; --blue-500:#3b82f6;
    --blue-200:#bfdbfe; --blue-100:#dbeafe; --blue-50:#eff6ff;
    --page:#e8f0ff; --card:#ffffff; --card-shadow:0 30px 60px -20px rgba(37,99,235,.35), 0 0 0 1px rgba(37,99,235,.08);
    --screen:#f3f7ff; --text:#0b1f5c; --muted:#6b86c9;
    --key:#f3f7ff; --key-text:#0b1f5c; --key-hover:#e3ecff;
    --op:#dbeafe; --op-text:#1d4ed8;
    --eq-a:#3b82f6; --eq-b:#1d4ed8; --eq-text:#fff;
    --line:#dbe6ff;
  }
  [data-theme="blue"] {
    --page:#0b1f5c; --card:linear-gradient(160deg,#2563eb,#1740b8); --card-shadow:0 30px 60px -20px rgba(0,0,0,.5);
    --screen:rgba(255,255,255,.12); --text:#fff; --muted:#bfd3ff;
    --key:#ffffff; --key-text:#0b1f5c; --key-hover:#e3ecff;
    --op:#dbeafe; --op-text:#1d4ed8;
    --eq-a:#0b1f5c; --eq-b:#07153f; --eq-text:#fff;
    --line:rgba(255,255,255,.2);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--page); color:var(--text);
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    display:grid; place-items:center; padding:16px; transition:background .4s;
  }
  .calc {
    width:100%; max-width:360px; background:var(--card); border-radius:32px;
    box-shadow:var(--card-shadow); padding:18px; position:relative; overflow:hidden;
    transition:background .4s;
  }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.02em; }
  .brand svg { width:34px; height:34px; display:block; }
  .brand span { font-size:20px; letter-spacing:.04em; }
  .tools { display:flex; gap:6px; }
  .icon-btn {
    width:36px; height:36px; border-radius:12px; border:0; cursor:pointer;
    background:var(--screen); color:var(--text); display:grid; place-items:center;
    transition:transform .1s, background .2s;
  }
  .icon-btn:hover { background:var(--key-hover); color:var(--blue-900); }
  .icon-btn:active { transform:scale(.92); }
  .icon-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .icon-btn.on { background:var(--blue-600); color:#fff; }

  .screen {
    background:var(--screen); border-radius:22px; padding:14px 16px 12px; min-height:128px;
    display:flex; flex-direction:column; justify-content:flex-end; text-align:right; position:relative;
    cursor:pointer; user-select:none;
  }
  .mem { position:absolute; left:14px; top:12px; font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.08em; opacity:0; transition:opacity .2s; }
  .mem.show { opacity:1; }
  .expr { font-size:16px; color:var(--muted); min-height:22px; overflow-x:auto; white-space:nowrap; scrollbar-width:none; direction:rtl; }
  .expr::-webkit-scrollbar { display:none; }
  .expr bdi { direction:ltr; unicode-bidi:isolate; }
  .result { font-size:46px; font-weight:800; line-height:1.15; white-space:nowrap; overflow:hidden; letter-spacing:-.01em; transition:font-size .1s; }
  .result.err { font-size:22px; color:#ef4444; }
  [data-theme="blue"] .result.err { color:#ffd0d0; }
  .toast { position:absolute; left:50%; top:10px; transform:translate(-50%,-30px); background:var(--blue-900); color:#fff; font-size:12px; font-weight:700; padding:6px 12px; border-radius:99px; opacity:0; transition:.25s; pointer-events:none; z-index:5; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  .memrow { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0 8px; }
  .memrow button { background:transparent; border:0; color:var(--muted); font:inherit; font-weight:800; font-size:13px; padding:6px; border-radius:10px; cursor:pointer; letter-spacing:.05em; }
  .memrow button:hover { background:var(--screen); color:var(--text); }

  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .keys button {
    font:inherit; font-size:22px; font-weight:700; height:62px; border:0; border-radius:20px; cursor:pointer;
    background:var(--key); color:var(--key-text); transition:transform .08s, background .15s, box-shadow .15s;
    box-shadow:0 2px 0 rgba(11,31,92,.08);
  }
  .keys button:hover { background:var(--key-hover); }
  .keys button:active, .keys button.press { transform:scale(.94); }
  .keys .op { background:var(--op); color:var(--op-text); }
  .keys .op:hover { background:#c7dcff; }
  .keys .fn { background:var(--blue-600); color:#fff; font-size:19px; }
  [data-theme="blue"] .keys .fn { background:var(--blue-900); }
  .keys .fn:hover { background:var(--blue-700); }
  .keys .eq { background:linear-gradient(160deg,var(--eq-a),var(--eq-b)); color:var(--eq-text); box-shadow:0 8px 18px -6px rgba(11,31,92,.5); }
  .keys .eq:hover { filter:brightness(1.1); }

  .panel {
    position:absolute; inset:0; background:var(--card); z-index:4; padding:18px; display:flex; flex-direction:column;
    transform:translateY(102%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  [data-theme="blue"] .panel { background:linear-gradient(160deg,#2563eb,#1740b8); }
  .panel.open { transform:none; }
  .panel h2 { margin:0; font-size:18px; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .hist { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .hist-item { background:var(--screen); border-radius:16px; padding:10px 14px; text-align:right; cursor:pointer; border:0; font:inherit; color:var(--text); }
  .hist-item:hover { background:var(--key-hover); color:var(--blue-900); }
  .hist-item small { display:block; color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; }
  .hist-item strong { font-size:22px; }
  .empty { margin:auto; color:var(--muted); text-align:center; font-size:14px; }
  .clear-hist { margin-top:12px; border:0; border-radius:14px; padding:12px; font:inherit; font-weight:700; background:var(--blue-600); color:#fff; cursor:pointer; }
  [data-theme="blue"] .clear-hist { background:var(--blue-900); }
  .hint { text-align:center; color:var(--muted); font-size:11px; margin-top:12px; }
  @media (max-width:380px){ .keys button{height:56px;font-size:20px} .result{font-size:40px} }
</style>
</head>
<body>
<main class="calc" id="calc">
  <div class="toast" id="toast"></div>

  <header>
    <div class="brand" aria-label="Quo">
      <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
        <rect width="64" height="64" rx="18" fill="url(#g)"/>
        <circle cx="32" cy="17" r="6" fill="#fff"/>
        <rect x="14" y="28" width="36" height="8" rx="4" fill="#fff"/>
        <circle cx="32" cy="47" r="6" fill="#fff"/>
      </svg>
      <span>QUO</span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="sepBtn" title="Thousands separators" aria-label="Toggle thousands separators">
        <svg viewBox="0 0 24 24"><path d="M5 17h.01M12 17h.01M19 17h.01M4 8h4M10 8h4M16 8h4"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
        <svg viewBox="0 0 24 24"><path d="M12 3c-4 5-6 7.5-6 11a6 6 0 0 0 12 0c0-3.500-2-6-6-11z"/></svg>
      </button>
      <button class="icon-btn" id="histBtn" title="History" aria-label="Open history">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
    </div>
  </header>

  <section class="screen" id="screen" title="Tap to copy result">
    <div class="mem" id="mem">M</div>
    <div class="expr" id="expr"><bdi></bdi></div>
    <div class="result" id="result">0</div>
  </section>

  <div class="memrow">
    <button data-act="mc">MC</button><button data-act="mr">MR</button>
    <button data-act="mminus">M−</button><button data-act="mplus">M+</button>
  </div>

  <div class="keys" id="keys">
    <button class="fn" data-act="clear">C</button>
    <button class="fn" data-act="paren">( )</button>
    <button class="fn" data-act="percent">%</button>
    <button class="op" data-op="÷">÷</button>

    <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
    <button class="op" data-op="×">×</button>

    <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
    <button class="op" data-op="−">−</button>

    <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
    <button class="op" data-op="+">+</button>

    <button data-act="neg">±</button><button data-d="0">0</button><button data-act="dot">.</button>
    <button class="eq" data-act="eq">=</button>
  </div>
  <div class="hint">Keyboard works too · Backspace deletes · Esc clears · tap screen to copy</div>

  <aside class="panel" id="panel" aria-label="History">
    <div class="panel-head">
      <h2>History</h2>
      <button class="icon-btn" id="closeHist" aria-label="Close history">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="hist" id="hist"></div>
    <button class="clear-hist" id="clearHist">Clear history</button>
  </aside>
</main>

<script>
(() => {
  const MINUS = '\u2212';
  const $ = id => document.getElementById(id);
  const exprEl = $('expr').firstElementChild, resEl = $('result'), memEl = $('mem');
  const calc = $('calc'), panel = $('panel'), histEl = $('hist'), toastEl = $('toast');

  let expr = '';          // what the user is typing
  let finished = false;   // true right after "="
  let lastResult = null;  // number
  let memory = 0, hasMem = false;
  let history = [];
  let useSep = true;

  // safe storage helpers
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  history = store.get('quo.history', []);
  useSep = store.get('quo.sep', true);
  document.documentElement.dataset.theme = store.get('quo.theme', 'light');

  /* ---------- parser (no eval) ---------- */
  function evaluate(src) {
    const tokens = src.match(/\d+\.?\d*|\.\d+|[+\u2212×÷()%]/g) || [];
    let i = 0;
    const peek = () => tokens[i], next = () => tokens[i++];

    function expression() {
      let left = term().v;
      while (peek() === '+' || peek() === MINUS) {
        const op = next(), t = term();
        const right = t.pct ? left * t.v : t.v;   // 200 + 10% => 220
        left = op === '+' ? left + right : left - right;
      }
      return left;
    }
    function term() {
      let cur = unary();
      for (;;) {
        const p = peek();
        if (p === '×' || p === '÷') {
          next(); const r = unary();
          if (p === '÷' && r.v === 0) throw new Error('div0');
          cur = { v: p === '×' ? cur.v * r.v : cur.v / r.v, pct: false };
        } else if (p === '(') {               // implicit multiplication: 2(3)
          const r = unary(); cur = { v: cur.v * r.v, pct: false };
        } else break;
      }
      return cur;
    }
    function unary() {
      if (peek() === MINUS) { next(); const u = unary(); return { v: -u.v, pct: u.pct }; }
      if (peek() === '+') { next(); return unary(); }
      return postfix();
    }
    function postfix() {
      let p = primary(), pct = false;
      while (peek() === '%') { next(); p = p / 100; pct = true; }
      return { v: p, pct };
    }
    function primary() {
      const t = next();
      if (t === undefined) throw new Error('syntax');
      if (t === '(') {
        const v = expression();
        if (peek() === ')') next();
        return v;
      }
      const n = parseFloat(t);
      if (isNaN(n)) throw new Error('syntax');
      return n;
    }
    const v = expression();
    if (i < tokens.length) throw new Error('syntax');
    if (!isFinite(v)) throw new Error('range');
    return v;
  }

  // balance parens & trim dangling operator for live preview / equals
  function normalize(s) {
    s = s.replace(/[+\u2212×÷]+$/,'').replace(/\($/,'');
    const open = (s.match(/\(/g) || []).length, close = (s.match(/\)/g) || []).length;
    return s + ')'.repeat(Math.max(0, open - close));
  }
  const clean = n => Number(parseFloat(n.toPrecision(12)));

  function fmt(n) {
    if (Math.abs(n) >= 1e15 || (n !== 0 && Math.abs(n) < 1e-9)) {
      return n.toExponential(6).replace(/\.?0+e/, 'e').replace('e+', 'e');
    }
    const s = clean(n).toLocaleString('en-US', { maximumFractionDigits: 10, useGrouping: useSep });
    return s.replace('-', MINUS);
  }
  // pretty-print the typed expression (group digits too)
  function pretty(s) {
    if (!useSep) return s;
    return s.replace(/\d+/g, m => m.length > 3 ? Number(m).toLocaleString('en-US') : m);
  }

  /* ---------- rendering ---------- */
  function fit() {
    resEl.style.fontSize = '';
    const base = parseFloat(getComputedStyle(resEl).fontSize);
    let size = base;
    while (resEl.scrollWidth > resEl.clientWidth && size > 18) { size -= 2; resEl.style.fontSize = size + 'px'; }
  }
  function render(showErr) {
    resEl.classList.remove('err');
    if (showErr) { resEl.textContent = showErr; resEl.classList.add('err'); resEl.style.fontSize=''; return; }
    if (finished) {
      resEl.textContent = fmt(lastResult);
    } else if (!expr) {
      resEl.textContent = '0';
    } else {
      // live preview of the answer, or the number being typed
      let preview = null;
      try {
        const n = normalize(expr);
        if (n && /[+\u2212×÷%()]/.test(n.replace(/^\u2212/, '').replace(/^\(?\u2212/, ''))) preview = evaluate(n);
      } catch {}
      if (preview !== null) resEl.textContent = fmt(preview);
      else {
        const m = expr.match(/(\d+\.?\d*|\.\d+)$/);
        resEl.textContent = m ? pretty(m[0]) : (expr.match(/(\d+\.?\d*|\.\d+)/g) || ['0']).slice(-1)[0];
      }
    }
    fit();
  }
  function renderExpr() {
    exprEl.textContent = pretty(expr);
    $('expr').scrollLeft = 0;
  }
  function refresh(err) { renderExpr(); render(err); memEl.classList.toggle('show', hasMem); }

  /* ---------- input actions ---------- */
  const isOp = c => c === '+' || c === MINUS || c === '×' || c === '÷';
  function startFresh() { if (finished) { expr = ''; finished = false; } }

  function digit(d) {
    startFresh();
    const m = expr.match(/(\d+\.?\d*|\.\d+)$/);
    if (m && m[0].length >= 15) return;
    if (m && m[0] === '0' && d !== '.') expr = expr.slice(0, -1);   // no leading zeros
    else if (/\)$|%$/.test(expr)) expr += '×';
    expr += d;
  }
  function dot() {
    startFresh();
    const m = expr.match(/(\d+\.?\d*|\.\d+)$/);
    if (m) { if (m[0].includes('.')) return; expr += '.'; }
    else { if (/\)$|%$/.test(expr)) expr += '×'; expr += '0.'; }
  }
  function op(o) {
    if (finished) { expr = fmtRaw(lastResult); finished = false; }
    if (!expr) { if (o === MINUS) expr = MINUS; return; }
    if (/\($/.test(expr)) { if (o === MINUS) expr += MINUS; return; }
    if (isOp(expr.slice(-1))) {
      if (expr.length === 1) return;
      expr = expr.slice(0, -1);
    }
    expr += o;
  }
  const fmtRaw = n => { const s = String(clean(n)); return s.includes('e') ? clean(n).toFixed(10).replace(/\.?0+$/,'') : s.replace('-', MINUS); };
  function paren() {
    startFresh();
    const open = (expr.match(/\(/g) || []).length, close = (expr.match(/\)/g) || []).length;
    const last = expr.slice(-1);
    if (open > close && (/\d|\)|%/.test(last))) expr += ')';
    else { if (/\d|\)|%/.test(last)) expr += '×'; expr += '('; }
  }
  function percent() {
    if (finished) { expr = fmtRaw(lastResult); finished = false; }
    if (/\d$|\)$|%$/.test(expr)) expr += '%';
  }
  function negate() {
    if (finished) { expr = fmtRaw(lastResult); finished = false; }
    let m;
    if ((m = expr.match(/\(\u2212(\d*\.?\d*)\)$/))) expr = expr.slice(0, m.index) + m[1];
    else if ((m = expr.match(/(\d+\.?\d*|\.\d+)$/))) expr = expr.slice(0, m.index) + '(' + MINUS + m[0] + ')';
    else if (!expr) expr = '(' + MINUS;
  }
  function back() {
    if (finished) { expr = fmtRaw(lastResult); finished = false; }
    expr = expr.slice(0, -1);
  }
  function clear() { expr = ''; finished = false; lastResult = null; }

  function equals() {
    if (!expr || finished) return;
    const n = normalize(expr);
    if (!n) return;
    try {
      const v = clean(evaluate(n));
      addHistory(pretty(n), fmt(v), v);
      lastResult = v; finished = true;
      exprEl.textContent = pretty(n) + ' =';
      render();
      memEl.classList.toggle('show', hasMem);
      return 'done';
    } catch (e) {
      refresh(e.message === 'div0' ? "Can't divide by 0" : 'Check expression');
      return 'err';
    }
  }

  /* ---------- memory ---------- */
  function currentValue() {
    if (finished) return lastResult;
    try { const n = normalize(expr); return n ? evaluate(n) : 0; } catch { return null; }
  }
  function memAct(a) {
    if (a === 'mc') { memory = 0; hasMem = false; toast('Memory cleared'); }
    else if (a === 'mr') {
      if (!hasMem) return toast('Memory is empty');
      startFresh();
      const s = fmtRaw(memory);
      if (/\d$|\)$|%$/.test(expr)) expr += '×';
      expr += memory < 0 ? '(' + s + ')' : s;
    } else {
      const v = currentValue();
      if (v === null) return toast('Nothing to store');
      memory += a === 'mplus' ? v : -v; hasMem = true;
      toast('Memory: ' + fmt(memory));
    }
    refresh();
  }

  /* ---------- history ---------- */
  function addHistory(e, r, v) {
    history.unshift({ e, r, v });
    history = history.slice(0, 40);
    store.set('quo.history', history);
  }
  function drawHistory() {
    histEl.innerHTML = '';
    if (!history.length) {
      histEl.innerHTML = '<div class="empty">Nothing yet.<br>Your calculations will appear here.</div>';
      return;
    }
    history.forEach(h => {
      const b = document.createElement('button');
      b.className = 'hist-item';
      b.innerHTML = '<small></small><strong></strong>';
      b.firstChild.textContent = h.e + ' =';
      b.lastChild.textContent = h.r;
      b.onclick = () => {
        if (finished || !expr) { expr = fmtRaw(h.v); finished = false; }
        else { if (/\d$|\)$|%$/.test(expr)) expr += '×'; expr += h.v < 0 ? '(' + fmtRaw(h.v) + ')' : fmtRaw(h.v); }
        closeHist(); refresh();
      };
      histEl.appendChild(b);
    });
  }
  const openHist = () => { drawHistory(); panel.classList.add('open'); $('histBtn').classList.add('on'); };
  const closeHist = () => { panel.classList.remove('open'); $('histBtn').classList.remove('on'); };

  /* ---------- misc ---------- */
  let toastT;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }
  async function copyResult() {
    const text = resEl.classList.contains('err') ? '' : resEl.textContent.replace(MINUS, '-').replace(/,/g, '');
    if (!text) return;
    try { await navigator.clipboard.writeText(text); toast('Copied ' + resEl.textContent); }
    catch {
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); toast('Copied ' + resEl.textContent); } catch { toast('Copy not available'); }
      t.remove();
    }
  }

  /* ---------- wiring ---------- */
  function run(fn, ...a) { fn(...a); refresh(); }
  $('keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.d !== undefined) return run(b.dataset.d === '.' ? dot : digit, b.dataset.d);
    if (b.dataset.op) return run(op, b.dataset.op);
    switch (b.dataset.act) {
      case 'clear': return run(clear);
      case 'paren': return run(paren);
      case 'percent': return run(percent);
      case 'neg': return run(negate);
      case 'dot': return run(dot);
      case 'eq': { const r = equals(); if (r === 'err') return; return; }
    }
  });
  document.querySelector('.memrow').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) memAct(b.dataset.act);
  });
  $('screen').addEventListener('click', copyResult);
  $('histBtn').onclick = () => panel.classList.contains('open') ? closeHist() : openHist();
  $('closeHist').onclick = closeHist;
  $('clearHist').onclick = () => { history = []; store.set('quo.history', history); drawHistory(); };
  $('themeBtn').onclick = () => {
    const t = document.documentElement.dataset.theme === 'blue' ? 'light' : 'blue';
    document.documentElement.dataset.theme = t; store.set('quo.theme', t);
  };
  $('sepBtn').onclick = () => {
    useSep = !useSep; store.set('quo.sep', useSep);
    toast(useSep ? 'Separators on' : 'Separators off');
    if (finished) { exprEl.textContent = exprEl.textContent; }
    refresh();
  };

  // keyboard
  const press = sel => { const b = document.querySelector(sel); if (b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 110); } };
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'Escape') { if (panel.classList.contains('open')) return closeHist(); press('[data-act=clear]'); return run(clear); }
    if (panel.classList.contains('open')) return;
    if (/^[0-9]$/.test(k)) { press(`[data-d="${k}"]`); return run(digit, k); }
    if (k === '.' || k === ',') { press('[data-act=dot]'); return run(dot); }
    const map = { '+': '+', '-': MINUS, '*': '×', 'x': '×', 'X': '×', '/': '÷' };
    if (map[k]) { e.preventDefault(); press(`[data-op="${map[k]}"]`); return run(op, map[k]); }
    if (k === 'Enter' || k === '=') { e.preventDefault(); press('[data-act=eq]'); return void equals(); }
    if (k === 'Backspace') { return run(back); }
    if (k === '(' || k === ')') { return run(() => { startFresh(); if (k === '(' && /\d|\)|%/.test(expr.slice(-1))) expr += '×'; expr += k; }); }
    if (k === '%') { press('[data-act=percent]'); return run(percent); }
    if (k === 'c' || k === 'C') return run(clear);
  });

  window.addEventListener('resize', fit);
  refresh();
})();
</script>
</body>
</html>
